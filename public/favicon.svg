<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Excursus">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d77"/>
      <stop offset="1" stop-color="#f0bd8b"/>
    </linearGradient>
  </defs>

  <!-- fundo escuro sem rx — browsers/OS cuidam do arredondamento do favicon -->
